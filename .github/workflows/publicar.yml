name: Publicar carrossel no Instagram

on:
  schedule:
    # 11h, 15h e 19h no horário de Brasília (UTC-3)
    - cron: "7 14 * * *"
    - cron: "7 18 * * *"
    - cron: "7 22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Só testar (não publica)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: publicar-instagram
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Publicar próximo da fila
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          BRANCH: ${{ github.ref_name }}
        run: python publicar.py
      - name: Salvar status da fila
        run: |
          git config user.name "publicador-bot"
          git config user.email "publicador-bot@users.noreply.github.com"
          git add fila.csv
          git diff --cached --quiet || git commit -m "Atualiza fila de publicação"
          git push
